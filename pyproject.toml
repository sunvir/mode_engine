[project]
name = "mode_engine"
version = "0.1.0"
description = "Mixture of Directed Experts (MoDE) engine: model loading, expansion, and plugin registry"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sunvir S. Gujral" }]
keywords = ["machine learning", "transformers", "mixture of experts", "pytorch", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/sunvir/mode_engine"
Repository = "https://github.com/sunvir/mode_engine"
"Bug Tracker" = "https://github.com/sunvir/mode_engine/issues"

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
